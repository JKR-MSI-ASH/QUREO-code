/* Small colored blocks drifting behind the card */
.sparks { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.sparks i { position: absolute; display: block; opacity: .75; animation: drift 7s ease-in-out infinite alternate; }
.sparks i:nth-child(1) { top: 7%; left: 6%; width: 26px; height: 12px; background: var(--mint); }
.sparks i:nth-child(2) { top: 22%; right: 7%; width: 14px; height: 30px; background: var(--sky); animation-delay: -2s; }
.sparks i:nth-child(3) { top: 40%; left: 4%; width: 30px; height: 14px; background: var(--pink); animation-delay: -4s; }
.sparks i:nth-child(4) { top: 58%; right: 5%; width: 24px; height: 11px; background: var(--amber); animation-delay: -1s; }
.sparks i:nth-child(5) { top: 74%; left: 8%; width: 12px; height: 24px; background: var(--sky); animation-delay: -3s; }
.sparks i:nth-child(6) { top: 86%; right: 9%; width: 30px; height: 14px; background: var(--mint); animation-delay: -5s; }
@keyframes drift { to { transform: translateY(-12px); } }

.deco { display: block; width: 100%; height: auto; margin-top: 4px; direction: ltr; }
.deco .b-line { fill: var(--line); }
.deco .b-sky { fill: var(--sky); }

.icon-btn {

  display: grid; place-items: center; cursor: pointer;
  transition: border-color .2s, color .2s;
}
.icon-btn:hover { border-color: var(--btn); color: var(--btn); }
.icon-btn svg { width: 20px; height: 20px; }

.card {
  background: var(--card);

  backdrop-filter: blur(6px);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;

.hero { display: block; width: 100%; height: auto; max-height: 180px; direction: ltr; }
.hero .hex { fill: var(--hex); }
.hero .glyph { fill: var(--glyph); font-family: var(--font-mono); font-weight: 700; font-size: 38px; }
.hero .dash { fill: none; stroke: var(--sky); stroke-width: 2.5; stroke-dasharray: 6 6; stroke-linecap: round; stroke-linejoin: round; }
.hero .node { fill: var(--surface); stroke: var(--sky); stroke-width: 2.5; }
.hero .chip-t { font-family: var(--font-mono); font-weight: 700; font-size: 16px; }

  line-height: 1.25;
  text-wrap: balance;

.hint { margin: 0; font-size: .85rem; color: var(--muted); }

.field {
  width: 100%;
  font: inherit; font-size: 1.15rem;
  color: var(--ink);
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  transition: border-color .2s;

.field:focus { outline: none; border-color: var(--btn); }
.field:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }

.status { min-height: 2.1rem; margin: 0; display: flex; align-items: center; }

.status .ok { background: var(--ok-bg); }
.status .warn { background: var(--warn-bg); }

.entries { display: flex; flex-direction: column; gap: 18px; }
.entry { display: flex; flex-direction: column; gap: 8px; }
.entry + .entry { padding-top: 18px; border-top: 1.5px dashed var(--line); }
.entry-name {
  margin: 0;
  font-family: var(--font-display); font-weight: 600;
  font-size: 1.2rem; line-height: 1.3;
}
.entry-name.empty { color: var(--muted); }

.win {
  border-radius: 10px;
  overflow: hidden;

  border: 1px solid var(--win-line);
}
.win-bar {
  display: flex; align-items: center; gap: 10px;

  padding: 8px 14px;
}
.dots { display: flex; gap: 6px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--win-dot); display: block; }
.win-title { font-size: .85rem; font-weight: 700; color: var(--win-title); letter-spacing: .02em; }
.win-body { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px; }
.val {
  flex: 1 1 140px; min-width: 0;
  font-family: var(--font-mono); font-weight: 600;
  font-size: 1.4rem; letter-spacing: .06em;
  text-align: left; direction: ltr;
  overflow-wrap: anywhere;

.win-code .val { color: var(--win-code); }
.win-pass .val { color: var(--win-pass); }
.val.empty { color: var(--win-dim); font-weight: 500; }
.btns { display: flex; gap: 6px; }
.btn {
  font: inherit; font-size: .85rem; font-weight: 500;
  padding: 6px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--win-line); background: transparent; color: var(--win-text);
  transition: border-color .2s;
}
.btn:hover:not(:disabled) { border-color: var(--win-code); }
.btn.primary { background: var(--win-btn); color: var(--win-on-btn); border-color: var(--win-btn); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--win-code); outline-offset: 2px; }
.icon-btn:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }

.admin { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 14px; }

@media (prefers-reduced-motion: reduce) {

      }
    }
    renderEntries(list);
  }
  $("q").addEventListener("input", search);

  /* ---------- الأسماء على الجهاز ---------- */
  var STORE_KEY = "korio-people-v1";
  var isEditor = true;

  function loadPeople() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr;
      }
    } catch (e) {}
    return SEED.slice();
  }
  function savePeople() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(USERS)); return true; } catch (e) { return false; }
  }
  function sortPeople() {
    USERS.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  }

  function idleStatus() {
    return [USERS.length ? "عدد الأسماء المحفوظة: " + USERS.length : "مفيش أسماء محفوظة لسه", "ok"];
  }

  function delBtn(u) {
    var b = el("button", "del", "حذف");
    b.type = "button";
    var armed = false, t = null;
    b.addEventListener("click", function () {
      if (!armed) {
        armed = true;
        b.textContent = "تأكيد الحذف";
        b.classList.add("confirm");
        t = setTimeout(function () {
          armed = false; b.textContent = "حذف"; b.classList.remove("confirm");
        }, 3000);
        return;
      }
      clearTimeout(t);
      USERS = USERS.filter(function (x) { return x.id !== u.id; });
      savePeople();
      search();
    });
    return b;
  }

  function formMsg(text, kind) {
    var m = $("formMsg");
    m.textContent = "";
    if (text) m.appendChild(el("span", "status-chip " + kind, text));
  }

  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("fName").value.trim();
    var code = $("fCode").value.trim();
    var pass = $("fPass").value;
    if (!name || !code || !pass) { formMsg("اكتب الاسم والكود وكلمة السر", "warn"); return; }
    var old = USERS.filter(function (u) { return u.id === code; })[0];
    if (old) {
      old.name = name; old.pass = pass;
    } else {
      USERS.push({ id: code, name: name, code: code, pass: pass, order: Date.now() });
    }
    sortPeople();
    var saved = savePeople();
    formMsg(saved ? (old ? "اتحدّث" : "اتحفظ") : "اتضاف مؤقتاً، المتصفح مش بيسمح بالحفظ", saved ? "ok" : "warn");
    $("fName").value = ""; $("fCode").value = ""; $("fPass").value = "";
    search();
  });

  USERS = loadPeople();
  sortPeople();
  $("admin").hidden = false;

  renderEntries([]);
  search();
})();
</script>
</body>
</html>
