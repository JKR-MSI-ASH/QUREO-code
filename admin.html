<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولد ملف بيانات الطلاب - Qureo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Tajawal", Tahoma, sans-serif;
    background: #0E1730;
    color: #E6ECFA;
    max-width: 760px;
    margin: 30px auto;
    padding: 0 16px 40px;
    line-height: 1.6;
  }
  .card {
    background: #16213F;
    border: 1px solid #2A3A62;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h1 { color: #5CC3F0; font-size: 1.45rem; margin: 0 0 8px; }
  p { color: #9DAAC8; font-size: 0.92rem; margin: 0 0 12px; }
  code { background: #0B1A30; padding: 2px 6px; border-radius: 5px; color: #86E6F7; direction: ltr; display: inline-block; }
  textarea {
    width: 100%;
    height: 180px;
    background: #0B1A30;
    color: #E6ECFA;
    border: 1.5px solid #2A3A62;
    border-radius: 10px;
    padding: 12px;
    font-family: "IBM Plex Mono", Consolas, monospace;
    font-size: 0.92rem;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #5CC3F0; }
  .row { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; align-items: center; }
  button, .file-lbl {
    background: #5CC3F0;
    color: #0E1730;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.92rem;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button.sec, .file-lbl {
    background: #1F2D57;
    color: #E6ECFA;
    border: 1px solid #2A3A62;
    font-weight: 600;
  }
  button:hover, .file-lbl:hover { filter: brightness(1.1); }
  input[type="file"] { display: none; }
  #msg { font-size: 0.92rem; font-weight: 600; }
  .ok { color: #4DE890; }
  .err { color: #FBB22E; }
</style>
</head>
<body>

<div class="card">
  <h1>مولد ملف students.js المموه (Qureo)</h1>
  <p>
    1. حدد الأعمدة الثلاثة في <strong>Excel</strong> (الاسم | الكود | كلمة السر) وانسخها (<code>Ctrl+C</code>) ثم الصقها في المربع بالأسفل (<code>Ctrl+V</code>)، أو ارفع ملف CSV/TXT.<br>
    2. اضغط <strong>1. تشفير وتوليد الكود</strong> ثم <strong>3. تحميل ملف students.js</strong> وضعه في نفس مجلد <code>index.html</code>.
  </p>

  <div class="row">
    <label class="file-lbl">
      📂 استيراد من ملف CSV أو TXT
      <input type="file" id="csvFile" accept=".csv,.txt">
    </label>
    <button type="button" class="sec" onclick="clearAll()">مسح الحقول</button>
  </div>

  <textarea id="input" placeholder="الاسم | الكود | كلمة السر">محمد احمد علي مدني | 472399397 | j67!sqqW</textarea>

  <div class="row">
    <button type="button" onclick="generate()">1. تشفير وتوليد الكود</button>
    <button type="button" class="sec" onclick="copyOut()">2. نسخ الكود</button>
    <button type="button" class="sec" onclick="downloadFile()">3. تحميل ملف students.js</button>
    <span id="msg"></span>
  </div>

  <textarea id="output" readonly placeholder="سيظهر هنا محتوى ملف students.js المشفر..."></textarea>
</div>

<script>
  var _K = "Qureo@2026#Sec";

  function encodeData(arr) {
    var json = JSON.stringify(arr);
    var bytes = new TextEncoder().encode(json);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) {
      bin += String.fromCharCode(bytes[i] ^ _K.charCodeAt(i % _K.length));
    }
    return btoa(bin);
  }

  function showMsg(text, isErr) {
    var m = document.getElementById("msg");
    m.textContent = text;
    m.className = isErr ? "err" : "ok";
  }

  document.getElementById("csvFile").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      document.getElementById("input").value = ev.target.result;
      showMsg("تم استيراد الملف، اضغط الآن على (تشفير وتوليد الكود)", false);
    };
    reader.readAsText(file, "UTF-8");
  });

  function generate() {
    var raw = document.getElementById("input").value;
    var lines = raw.split(/\r?\n/);
    var list = [];

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;

      var parts = line.split(/\t|\||,|;/).map(function (s) {
        return s.replace(/^"|"$/g, "").trim();
      });

      if (parts.length >= 3 && parts[0] && parts[1]) {
        if (i === 0 && (parts[0] === "الاسم" || parts[0].toLowerCase() === "name")) continue;
        list.push({ name: parts[0], code: parts[1], pass: parts[2] });
      }
    }

    if (list.length === 0) {
      showMsg("لم يتم العثور على بيانات صالحة! تأكد من وجود: الاسم ثم الكود ثم كلمة السر.", true);
      return;
    }

    var encoded = encodeData(list);
    var fileContent = '/* ملف بيانات الطلاب المموه - عدد السجلات: ' + list.length + ' */\nvar _0x9f2a = "' + encoded + '";\n';
    document.getElementById("output").value = fileContent;
    showMsg("تم تشفير " + list.length + " طالب بنجاح! اضغط الآن زر (3. تحميل ملف students.js)", false);
  }

  function copyOut() {
    var out = document.getElementById("output");
    if (!out.value) return showMsg("ولّد الكود أولاً", true);
    out.select();
    navigator.clipboard.writeText(out.value).then(function () {
      showMsg("تم نسخ الكود للحافظة!", false);
    });
  }

  function downloadFile() {
    var content = document.getElementById("output").value;
    if (!content) return showMsg("ولّد الكود أولاً قبل التحميل", true);
    var blob = new Blob([content], { type: "application/javascript;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "students.js";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    showMsg("تم تحميل students.js بنجاح! انقله الآن بجانب index.html", false);
  }

  function clearAll() {
    document.getElementById("input").value = "";
    document.getElementById("output").value = "";
    document.getElementById("csvFile").value = "";
    showMsg("", false);
  }
</script>
</body>
</html>
